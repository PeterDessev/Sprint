[package]
name = "sprint-gui"
description = "Sprint desktop GUI (eframe/egui)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
sprint-gcode.workspace = true
sprint-proto.workspace = true
sprint-host.workspace = true
sprint-viewer.workspace = true
eframe.workspace = true
egui.workspace = true
egui_extras.workspace = true
egui_plot.workspace = true
egui-phosphor.workspace = true
image.workspace = true
rfd.workspace = true
parking_lot.workspace = true
crossbeam-channel.workspace = true
serde.workspace = true
anyhow.workspace = true
log.workspace = true
# Validates system font files before they reach egui's font loader (which
# panics on unparsable fonts). Same version and a subset of the features
# epaint already uses, so it adds nothing to the build.
skrifa = { version = "0.44", default-features = false, features = ["std"] }
# The local UTC offset for "finishes at 14:32" (already in the lockfile).
time = { version = "0.3", default-features = false, features = ["std", "local-offset"] }

[dev-dependencies]
egui_kittest.workspace = true
# Custom adapter selection for the snapshot renderer (see tests/common).
egui-wgpu.workspace = true
