[package]
name = "sprint"
description = "Sprint: a fast, modern 3D printer host (GUI, TUI and CLI)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true
keywords.workspace = true
categories = ["command-line-utilities", "gui", "hardware-support"]

[[bin]]
name = "sprint"
path = "src/main.rs"

[dependencies]
sprint-gcode.workspace = true
sprint-proto.workspace = true
sprint-sim.workspace = true
sprint-host.workspace = true
sprint-gui.workspace = true
sprint-tui.workspace = true
clap.workspace = true
crossbeam-channel.workspace = true
crossterm.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
serde.workspace = true
serde_json.workspace = true
unicode-width = "0.2"

# Releasing the console of a GUI launch from Explorer (see src/console.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }
