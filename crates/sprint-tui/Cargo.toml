[package]
name = "sprint-tui"
description = "Sprint terminal interfaces: full-screen TUI and line-mode shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true
keywords.workspace = true
categories = ["command-line-utilities", "hardware-support"]

[dependencies]
sprint-gcode.workspace = true
sprint-proto.workspace = true
sprint-host.workspace = true
ratatui.workspace = true
crossterm.workspace = true
crossbeam-channel.workspace = true
anyhow.workspace = true
log.workspace = true
unicode-width = "0.2"
# The line shell: editing, history and printing above the prompt.
rustyline = { version = "19.0.0", default-features = false, features = ["with-file-history"] }
# Ctrl+C as a request (see src/interrupt.rs).
ctrlc = "3.5"

[dev-dependencies]
# PNG snapshots of test screens (src/snapshot.rs): the Hack font egui
# bundles, its outlines read with the skrifa version epaint already uses.
image.workspace = true
skrifa = { version = "0.44", default-features = false, features = ["std"] }
epaint_default_fonts = "0.36"

# The demo carries tests that draw every screen with a test backend.
[[example]]
name = "widgets_demo"
test = true
