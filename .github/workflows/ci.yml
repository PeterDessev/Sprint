name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Every job uses an exact toolchain, so a new Rust release (and the
  # clippy lints it adds) cannot turn CI red on its own. Bump it on
  # purpose, together with any fixes the new clippy asks for.
  RUST_TOOLCHAIN: "1.97.1"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - run: cargo fmt --all --check

  # `--workspace` everywhere: the workspace's default member is only the
  # `sprint` binary, so a bare `cargo clippy` or `cargo test` would skip
  # the other crates.
  check:
    name: Clippy and tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # serialport links libudev; the windowing libraries are for winit.
      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libwayland-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The GUI snapshots are compared only on a machine with the fonts and
      # GPU they were made with; elsewhere the tests use egui's bundled
      # fonts. Runners have no GPU, and the software rasterizers some of
      # them offer vary and can crash, so the GPU tests run as without an
      # adapter here: rendering is checked on a developer machine.
      - name: Tests
        env:
          SPRINT_TEST_NO_GPU: "1"
        run: cargo test --workspace --locked --no-fail-fast

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libwayland-dev libxkbcommon-dev
      # Keep in step with `rust-version` in Cargo.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked
